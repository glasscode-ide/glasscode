name: Release

# A release of Glasscode (docs/releasing.md).
#
# Pushing the tag v<version> builds the Windows files and puts them into a DRAFT GitHub release:
# the installer, the zip, a .sha256 for each, and glasscode-windows.json, the signed manifest that
# an installed Glasscode updates from. A person reads the draft and publishes it; only then does
# an installed Glasscode see it.
#
# Started by hand (Actions > Release > Run workflow) it builds the same files and keeps them as
# an artifact of the run, without a release: the test of this workflow.
#
# The jobs that build have no secret that publishes. Only the last job, "Publish", has the
# release key, and only for a tag. It runs in the environment "release": give that environment
# required reviewers and a rule for the tags v*, and keep GLASSCODE_RELEASE_KEY as a secret of
# the environment, not of the repository (docs/releasing.md). Then nobody signs a release alone,
# and a run started by hand from a branch never sees the key.
#
# The Mac files are not built here (no runner signs and notarizes them yet): the person who
# builds the Mac app adds them to the draft.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# Two runs for the same tag would write the same release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

defaults:
  run:
    shell: bash

jobs:
  # The version, the build number and the channel, once, for both jobs.
  plan:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      build: ${{ steps.plan.outputs.build }}
      channel: ${{ steps.plan.outputs.channel }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit count numbers the build (GLASSCODE_BUILD).
          fetch-depth: 0

      - name: Read the version and check the tag
        id: plan
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Cargo.toml has no version like 1.2.3 or 1.2.3-beta.1: '$version'"
            exit 1
          fi
          if [ "$REF_TYPE" = tag ] && [ "$REF_NAME" != "v$version" ]; then
            echo "::error::The tag $REF_NAME is not v$version, the version of Cargo.toml"
            exit 1
          fi
          # A version with a suffix (0.2.0-beta.1) is a pre-release, for the beta channel.
          case "$version" in *-*) channel=beta ;; *) channel=stable ;; esac
          if [ "$REF_TYPE" = tag ] && ! grep -Fq "## [$version]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section '## [$version]'"
            exit 1
          fi
          {
            echo "version=$version"
            echo "build=$(git rev-list --count HEAD)"
            echo "channel=$channel"
          } >> "$GITHUB_OUTPUT"

  # The Linux builds of the server daemon, which the app installs on a person's server.
  glasscoded:
    name: glasscoded for Linux
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Build glasscoded for x86_64 and aarch64
        env:
          GLASSCODE_BUILD: ${{ needs.plan.outputs.build }}
        run: script/build-glasscoded.sh

      - name: Keep the daemons for the Windows job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: glasscoded-linux
          path: target/glasscoded/glasscoded-linux-*
          if-no-files-found: error
          retention-days: 5

  windows:
    name: Windows
    needs: [plan, glasscoded]
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      GLASSCODE_BUILD: ${{ needs.plan.outputs.build }}
      # A secret cannot be read in `if`.
      HAS_SIGN_CERT: ${{ secrets.WINDOWS_SIGN_CERT_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Install the toolchain of rust-toolchain.toml
        run: |
          rustup toolchain install
          cargo --version

      - name: Cache the cargo folders
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/bin/cargo-about.exe
            target/
          key: ${{ runner.os }}-release-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-release-cargo-

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco upgrade innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # It writes THIRD-PARTY-NOTICES.html, and stops the build at a package whose licence
      # about.toml does not accept.
      - name: Install cargo-about
        run: cargo about --version || cargo install --locked cargo-about --features cli

      - name: Get the Linux builds of the server daemon
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: glasscoded-linux
          path: target/glasscoded

      # Optional. The secrets WINDOWS_SIGN_CERT_BASE64 (a .pfx file in base64) and
      # WINDOWS_SIGN_CERT_PASSWORD (its password) sign the programs and the installer.
      # Only for a tag: a run started by hand builds unsigned programs.
      - name: Write the code signing certificate
        if: env.HAS_SIGN_CERT == 'true' && github.ref_type == 'tag'
        shell: pwsh
        env:
          SIGN_CERT_BASE64: ${{ secrets.WINDOWS_SIGN_CERT_BASE64 }}
        run: |
          $file = Join-Path $env:RUNNER_TEMP 'glasscode-sign.pfx'
          [IO.File]::WriteAllBytes($file, [Convert]::FromBase64String($env:SIGN_CERT_BASE64))
          Add-Content -Path $env:GITHUB_ENV -Value "SIGN_CERT=$file"

      - name: Build the programs, the zip and the installer
        shell: pwsh
        env:
          SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File script/bundle-windows.ps1 -Publish

      # The section of CHANGELOG.md for this version is the text of the release and the notes in
      # the manifest.
      - name: Write the release notes
        run: |
          awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          cat release-notes.md

      - name: Write the checksums
        working-directory: target/release
        run: |
          for file in "Glasscode-$VERSION-setup.exe" "Glasscode-$VERSION-windows-x86_64.zip"; do
            sha256sum "$file" > "$file.sha256"
            cat "$file.sha256"
          done
          cp ../../release-notes.md release-notes.md

      - name: Keep the files of this run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: glasscode-windows-${{ needs.plan.outputs.version }}
          path: |
            target/release/Glasscode-*-setup.exe
            target/release/Glasscode-*-windows-x86_64.zip
            target/release/Glasscode-*.sha256
            target/release/release-notes.md
          if-no-files-found: error
          retention-days: 30

  # Sign the manifest and write the draft release. The only job with the release key and with the
  # right to write a release; it builds nothing that goes into the programs.
  publish:
    name: Publish
    needs: [plan, windows]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Required reviewers and the tag rule of this environment decide who may release.
    environment: release
    permissions:
      # To write the draft release.
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      GLASSCODE_BUILD: ${{ needs.plan.outputs.build }}
      CHANNEL: ${{ needs.plan.outputs.channel }}
      # A secret cannot be read in `if`.
      HAS_RELEASE_KEY: ${{ secrets.GLASSCODE_RELEASE_KEY != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Get the files of the Windows job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: glasscode-windows-${{ needs.plan.outputs.version }}
          path: release

      - name: Check the checksums
        working-directory: release
        run: sha256sum -c "Glasscode-$VERSION-setup.exe.sha256" "Glasscode-$VERSION-windows-x86_64.zip.sha256"

      # The signed manifest: what an installed Glasscode trusts. Without the secret
      # GLASSCODE_RELEASE_KEY the release has none, and no installed Glasscode updates to it.
      - name: Sign the release manifest
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          GLASSCODE_RELEASE_KEY: ${{ secrets.GLASSCODE_RELEASE_KEY }}
        run: |
          rustup toolchain install
          cargo run --locked -p glasscode_core --example release -- sign \
            --product glasscode-windows --version "$VERSION" --build "$GLASSCODE_BUILD" --channel "$CHANNEL" \
            --os windows --arch x86_64 \
            --file "release/Glasscode-$VERSION-windows-x86_64.zip" \
            --notes-file release/release-notes.md \
            --out release/glasscode-windows.json
          cargo run --locked -p glasscode_core --example release -- check \
            release/glasscode-windows.json "release/Glasscode-$VERSION-windows-x86_64.zip"

      - name: Say that the release has no signed manifest
        if: env.HAS_RELEASE_KEY != 'true'
        run: echo "::warning::The secret GLASSCODE_RELEASE_KEY is not set in the environment release, so this release has no glasscode-windows.json and no installed Glasscode updates to it (docs/releasing.md)."

      # A draft: nobody sees it, and no Glasscode updates to it, until a person publishes it.
      - name: Put the files into the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          files=("release/Glasscode-$VERSION-setup.exe" "release/Glasscode-$VERSION-setup.exe.sha256"
                 "release/Glasscode-$VERSION-windows-x86_64.zip" "release/Glasscode-$VERSION-windows-x86_64.zip.sha256")
          if [ -f release/glasscode-windows.json ]; then
            files+=(release/glasscode-windows.json)
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            # A second run for the same tag: the files are replaced, the text stays.
            gh release upload "$TAG" --clobber "${files[@]}"
          else
            flags=(--draft --verify-tag --title "Glasscode $VERSION" --notes-file release/release-notes.md)
            if [ "$CHANNEL" = beta ]; then
              flags+=(--prerelease)
            fi
            gh release create "$TAG" "${flags[@]}" "${files[@]}"
          fi
