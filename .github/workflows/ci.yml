name: CI

on:
  pull_request:
    branches: [main, windows-port, ui-redesign, manager-v2]
  push:
    branches: [main, windows-port, ui-redesign, manager-v2]
  # By hand (Actions > CI > Run workflow): all jobs, the Windows installer too.
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request makes the older run useless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Incremental files only make the cache bigger in CI.
  CARGO_INCREMENTAL: 0

# The same shell on both systems; a failed command stops the step.
defaults:
  run:
    shell: bash

jobs:
  macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install the toolchain of rust-toolchain.toml
        run: |
          rustup toolchain install
          cargo --version

      - name: Cache the cargo folders
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check the app
        run: cargo check --locked -p glasscode

      - name: Check the server daemon
        run: cargo check --locked -p glasscoded

      - name: Check the console program
        run: cargo check --locked -p glasscode_cli

      - name: Test the core library
        run: cargo test --locked -p glasscode_core -- --test-threads=1

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install the toolchain of rust-toolchain.toml
        run: |
          rustup toolchain install
          cargo --version

      - name: Cache the cargo folders
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check the app
        run: cargo check --locked -p glasscode

      - name: Test the core library
        run: cargo test --locked -p glasscode_core -- --test-threads=1

      - name: Test the console program
        run: cargo test --locked -p glasscode_cli

      # The app's own tests: colours and their contrast, icons, key tables, terminal keys.
      - name: Test the app
        run: cargo test --locked -p glasscode

  # The server daemon's own system, and the CLI flag probe. The app (GPUI) is not built here.
  linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # Every flag Glasscode passes to claude and codex (cli-flags.json) against the help of each
      # recorded version (script/cli-help/): each Claude file with each Codex file, as the two
      # checks are independent. It needs only bash, awk and jq, so it runs first.
      - name: Probe the CLI flags
        run: |
          shopt -s nullglob
          claude=(script/cli-help/claude-*.txt)
          codex=(script/cli-help/codex-*.txt)
          if [ ${#claude[@]} -eq 0 ] || [ ${#codex[@]} -eq 0 ]; then
            echo "No recorded help in script/cli-help/"
            exit 1
          fi
          for c in "${claude[@]}"; do
            for x in "${codex[@]}"; do
              bash script/cli-probe.sh "$c" "$x"
            done
          done

      - name: Install the toolchain of rust-toolchain.toml
        run: |
          rustup toolchain install
          cargo --version

      - name: Cache the cargo folders
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check the server daemon
        run: cargo check --locked -p glasscoded

      - name: Test the core library and the server daemon
        run: cargo test --locked -p glasscode_core -p glasscoded -- --test-threads=1

  # The eval suites of Manager v2 (crates/glasscode_core/tests/evals), with the stand-in agents of
  # script/test-agents (Python scripts; the runner has python3 and git) and no model: adversarial,
  # memory poisoning, retrieval (it prints recall at 5 and fails below its floor) and op selection.
  evals:
    name: Evals
    needs: linux
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install the toolchain of rust-toolchain.toml
        run: |
          rustup toolchain install
          cargo --version

      - name: Cache the cargo folders
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-evals-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-evals-cargo-
            ${{ runner.os }}-cargo-

      - name: Run the eval suites
        run: cargo test --locked -p glasscode_core --features testkit --test evals -- --test-threads=1 --nocapture

  # The soak of Manager v2 (slice plan section 14, M55): seven simulated days of the reference
  # load on the virtual clock (crates/glasscode_core/src/testkit/soak.rs), with sleeps, restarts,
  # crashes and partitions at random points, three seeds. No model and no thread: it asserts no
  # duplicate effect, one report per turn, wakes under the hour's cap, the journal's retention, and
  # no growth in open files or threads. Then release 1's other automated gates by name (M55 step 2).
  soak:
    name: Soak
    needs: linux
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install the toolchain of rust-toolchain.toml
        run: |
          rustup toolchain install
          cargo --version

      - name: Cache the cargo folders
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-soak-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-soak-cargo-
            ${{ runner.os }}-cargo-

      - name: Run the seven-day soak
        run: cargo test --locked -p glasscode_core --lib -- --test-threads=1 --ignored --exact testkit::soak::seven_day_soak

      - name: Run release 1's other gates (fault injection per store, restore, forget a person)
        run: cargo test --locked -p glasscode_core --lib -- --test-threads=1 fault_injection_for_every_store restore_after_damage forget_person_removes_everywhere

  # The release programs and the installer (script/bundle-windows.ps1). A release build takes much
  # longer than the checks above, so it is a job of its own, with its own cache. It builds on each
  # push to main, windows-port and ui-redesign, when started by hand, and for a pull request that
  # changes the release build. For other pull requests, and for pushes to manager-v2 (the Manager
  # v2 integration branch, which merges into main at checkpoints), it skips its steps.
  windows-installer:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # A secret cannot be read in `if`. Pull requests from forks get no secrets: then, and when
      # the secrets are not set, the installer is unsigned.
      HAS_SIGN_CERT: ${{ secrets.WINDOWS_SIGN_CERT_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit count numbers the build (GLASSCODE_BUILD), and a pull request is compared
          # with its base.
          fetch-depth: 0

      - name: Find out whether the release build changes
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          if [ "$EVENT" = push ] && [ "$REF" = refs/heads/manager-v2 ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "A push to manager-v2 does not build the installer: the push to main after a checkpoint merge does."
          elif [ "$EVENT" != pull_request ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only HEAD^1 HEAD | grep -E '^(script/bundle-windows\.ps1|script/windows/|crates/glasscode/(build\.rs|Cargo\.toml|resources/|src/main\.rs)|crates/glasscode_cli/Cargo\.toml|vendor/gpui/(build\.rs|resources/)|Cargo\.(toml|lock)|rust-toolchain\.toml|\.cargo/|\.github/workflows/ci\.yml)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "This pull request changes no file of the release build: the push after the merge builds the installer."
          fi

      - name: Install the toolchain of rust-toolchain.toml
        if: steps.scope.outputs.build == 'true'
        run: |
          rustup toolchain install
          cargo --version

      - name: Cache the cargo folders
        if: steps.scope.outputs.build == 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-release-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-release-cargo-

      # The runner image can have Inno Setup already: this installs it, or brings it up to date.
      - name: Install Inno Setup
        if: steps.scope.outputs.build == 'true'
        shell: pwsh
        run: |
          choco upgrade innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Optional. The secrets WINDOWS_SIGN_CERT_BASE64 (a .pfx file in base64) and
      # WINDOWS_SIGN_CERT_PASSWORD (its password) sign the programs and the installer.
      - name: Write the code signing certificate
        if: steps.scope.outputs.build == 'true' && env.HAS_SIGN_CERT == 'true'
        shell: pwsh
        env:
          SIGN_CERT_BASE64: ${{ secrets.WINDOWS_SIGN_CERT_BASE64 }}
        run: |
          $file = Join-Path $env:RUNNER_TEMP 'glasscode-sign.pfx'
          [IO.File]::WriteAllBytes($file, [Convert]::FromBase64String($env:SIGN_CERT_BASE64))
          Add-Content -Path $env:GITHUB_ENV -Value "SIGN_CERT=$file"

      - name: Build the release programs and the installer
        if: steps.scope.outputs.build == 'true'
        shell: pwsh
        env:
          SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File script/bundle-windows.ps1

      - name: Keep the installer
        if: steps.scope.outputs.build == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: glasscode-windows-installer
          path: target/release/Glasscode-*-setup.exe
          if-no-files-found: error
          retention-days: 30
