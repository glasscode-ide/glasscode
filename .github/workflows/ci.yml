name: CI

on:
  pull_request:
    branches: [main, windows-port]
  push:
    branches: [main, windows-port]

permissions:
  contents: read

# A newer push to the same pull request makes the older run useless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Incremental files only make the cache bigger in CI.
  CARGO_INCREMENTAL: 0

# The same shell on both systems; a failed command stops the step.
defaults:
  run:
    shell: bash

jobs:
  macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install the toolchain of rust-toolchain.toml
        run: |
          rustup toolchain install
          cargo --version

      - name: Cache the cargo folders
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check the app
        run: cargo check --locked -p glasscode

      - name: Test the core library
        run: cargo test --locked -p glasscode_core -- --test-threads=1

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install the toolchain of rust-toolchain.toml
        run: |
          rustup toolchain install
          cargo --version

      - name: Cache the cargo folders
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Test the core library
        run: cargo test --locked -p glasscode_core -- --test-threads=1
