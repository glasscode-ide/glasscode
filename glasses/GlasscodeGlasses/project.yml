name: GlasscodeGlasses
options:
  bundleIdPrefix: dev.glasscode
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  # The Meta Wearables toolkit — same remote package + exact version DisplayAccess pins.
  DAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: "1.0.1"
  # SSH to the server's gate with the phone's Secure Enclave key (ServerLink.swift).
  NIO:
    url: https://github.com/apple/swift-nio.git
    from: "2.65.0"
  NIOSSH:
    url: https://github.com/apple/swift-nio-ssh.git
    from: "0.8.0"

targets:
  GlasscodeGlasses:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: DAT
        product: MWDATCore
      - package: DAT
        product: MWDATDisplay
      - package: DAT
        product: MWDATInputs
      - package: NIO
        product: NIOCore
      - package: NIO
        product: NIOPosix
      - package: NIOSSH
        product: NIOSSH
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.glasscode.glasses
        # Your Apple team id. Set it here or in Xcode > Signing.
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Glasscode
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # What you say is turned into text on the phone; the manager's answer is spoken to the glasses.
        NSMicrophoneUsageDescription: "Glasscode hears what you ask your manager, and turns it into text on this phone."
        NSSpeechRecognitionUsageDescription: "Glasscode turns what you say into text on this phone, to ask your manager."
        NSCameraUsageDescription: "Glasscode scans the pairing code your Mac shows."
        NSBluetoothAlwaysUsageDescription: "Needed to connect to your Meta glasses."
        NSLocalNetworkUsageDescription: "Lets Glasscode reach your Mac and your server over Tailscale."
        NSBonjourServices:
          - _bonjour._tcp
        UIBackgroundModes:
          - audio
          - processing
          - bluetooth-central
          - bluetooth-peripheral
          - external-accessory
        UISupportedExternalAccessoryProtocols:
          - com.meta.ar.wearable
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: dev.glasscode.glasses
            CFBundleURLSchemes:
              - glasscodeglasses
              - glasscode
        # DAT config. Developer Mode → MetaAppID can be empty (skips attestation).
        MWDAT:
          AppLinkURLScheme: "glasscodeglasses://"
          MetaAppID: ""
          ClientToken: ""
          TeamID: ""

  # Behaviour checks against the toolkit's simulated glasses (no hardware needed):
  #   xcodebuild test -project GlasscodeGlasses.xcodeproj -scheme GlasscodeGlasses \
  #     -destination 'platform=iOS Simulator,name=iPhone 17'
  GlasscodeGlassesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: GlasscodeGlasses
      - package: DAT
        product: MWDATMockDevice
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.glasscode.glasses.tests
        SWIFT_VERSION: "5.0"

schemes:
  GlasscodeGlasses:
    build:
      targets:
        GlasscodeGlasses: all
        GlasscodeGlassesTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GlasscodeGlassesTests
