[package]
name = "glasscoded"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"
description = "Glasscode's server daemon: keeps Claude and Codex sessions running on a developer's always-on machine"

[[bin]]
name = "glasscoded"
path = "src/main.rs"

# The daemon is built only on Unix; on Windows its main just says so and needs nothing.
[target.'cfg(unix)'.dependencies]
base64.workspace = true
anyhow.workspace = true
glasscode_core.workspace = true
libc.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[target.'cfg(unix)'.dev-dependencies]
tempfile.workspace = true
