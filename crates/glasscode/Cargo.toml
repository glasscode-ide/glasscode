[package]
name = "glasscode"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"

[[bin]]
name = "glasscode"
path = "src/main.rs"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
image.workspace = true
alacritty_terminal.workspace = true
anyhow.workspace = true
async-channel = { workspace = true, features = ["std"] }
gpui.workspace = true
gpui_platform = { workspace = true, features = ["font-kit", "runtime_shaders"] }
log.workspace = true
glasscode_core.workspace = true
env_logger.workspace = true
unicode-segmentation.workspace = true
qrcode = { version = "0.14", default-features = false }

# The icon and the version of glasscode.exe (build.rs), with the crate that embeds GPUI's manifest.
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0"
