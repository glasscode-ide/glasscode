[package]
name = "glasscode_core"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"

[features]
# The test kit of Manager v2 (`glasscode_core::testkit`): scratch homes, stand-in agents, the
# virtual clock and the eval harnesses. The core's own tests have it always; it adds no dependency.
testkit = []

# A scratch Glasscode home for trying things by hand (`testkit::Home`).
[[bin]]
name = "make-test-home"
required-features = ["testkit"]

# The eval suites with stand-in agents and no model (the `evals` job of CI).
[[test]]
name = "evals"
path = "tests/evals/main.rs"
required-features = ["testkit"]

[dependencies]
ring = "0.17"
libc.workspace = true
base64.workspace = true
rand.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
url.workspace = true
urlencoding.workspace = true
anyhow.workspace = true
dirs.workspace = true
log.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# The process list (`sys::processes`): parents and work folders without `ps` or `lsof`.
sysinfo.workspace = true
uuid = { workspace = true, features = ["v4"] }
# Glasscode devices: roster signatures (P-256) and the relay connection (WebSocket over TLS).
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
tokio = { version = "1", features = ["rt", "net", "io-util", "io-std", "macros", "time", "sync"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
ureq = { version = "2.12", default-features = false, features = ["tls"] }

[target.'cfg(windows)'.dependencies]
# The local time zone (`sys::local_time`); Unix asks the C library instead.
chrono = { workspace = true, features = ["clock"] }
# The named pipe of the `glasscode` command (`sys::control`), open only to this user;
# Credential Manager (`sys::secrets`), where macOS asks /usr/bin/security instead; and the
# notification sounds (`sys::play_sound`); and the tables of listening ports (`sys::listeners`).
windows = { workspace = true, features = ["Win32_Security_Authorization", "Win32_System_Pipes", "Win32_Security_Credentials", "Win32_Media_Audio", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock"] }

[dev-dependencies]
filetime = "0.2"
tempfile.workspace = true
# The tests read the Codex config that Glasscode adds to as TOML, as Codex does.
toml.workspace = true
