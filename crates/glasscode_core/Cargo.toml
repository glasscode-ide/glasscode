[package]
name = "glasscode_core"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"

[dependencies]
ring = "0.17"
libc.workspace = true
base64.workspace = true
rand.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
url.workspace = true
urlencoding.workspace = true
anyhow.workspace = true
dirs.workspace = true
log.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
uuid = { workspace = true, features = ["v4"] }
# Glasscode devices: roster signatures (P-256) and the relay connection (WebSocket over TLS).
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
tokio = { version = "1", features = ["rt", "net", "io-util", "io-std", "macros", "time", "sync"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
ureq = { version = "2.12", default-features = false, features = ["tls"] }

[target.'cfg(windows)'.dependencies]
# The local time zone (`sys::local_time`); Unix asks the C library instead.
chrono = { workspace = true, features = ["clock"] }

[dev-dependencies]
filetime = "0.2"
tempfile.workspace = true
