# The licences that a package of Glasscode's programs may have (cargo-about, which writes
# THIRD-PARTY-NOTICES.html for the installer: script/bundle-windows.ps1). All of them let
# Glasscode be distributed under Apache-2.0. A new dependency with another licence makes the
# release build stop here: the owners decide then (CONTRIBUTING.md), nobody adds a line alone.
# No GPL, LGPL or AGPL licence belongs in this list.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    # The list of root certificates (webpki-roots): a permissive licence for data.
    "CDLA-Permissive-2.0",
    # Weak copyleft for the files of the package itself only: used unchanged, as a library.
    "MPL-2.0",
]

# The packages of this repository are Glasscode itself and the copies of GPUI (NOTICE).
ignore-build-dependencies = false
ignore-dev-dependencies = true
