<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glasscode Voice</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="bar">
    <div class="brand">
      <span class="logo" aria-hidden="true">☾</span>
      <span>Glasscode <em>voice</em></span>
    </div>
    <button class="ctx" id="ctx" title="Which session Glasscode is focused on">All sessions</button>
  </header>

  <!-- Glasscode. Click the face to wake her; click again to send her idle. -->
  <div class="stage" id="stage" data-state="idle" role="button" tabindex="0"
       aria-label="Glasscode — click to start or stop talking" title="Click to start · click again to stop">
    <div class="aura"></div>
    <div class="rings"><i></i><i></i><i></i></div>
    <svg class="moon" viewBox="0 0 200 200" aria-hidden="true">
      <defs>
        <radialGradient id="disc" cx="38%" cy="30%" r="80%">
          <stop offset="0%" stop-color="#fdf6de"/>
          <stop offset="55%" stop-color="#f0e3b2"/>
          <stop offset="100%" stop-color="#d4bd80"/>
        </radialGradient>
      </defs>
      <circle class="disc" cx="100" cy="100" r="62" fill="url(#disc)"/>
      <circle class="crater" cx="131" cy="80" r="9"/>
      <circle class="crater" cx="140" cy="113" r="5.5"/>
      <circle class="crater" cx="74" cy="134" r="7"/>
      <g class="eyes">
        <ellipse class="eye" cx="83" cy="99" rx="7" ry="10"/>
        <ellipse class="eye" cx="117" cy="99" rx="7" ry="10"/>
      </g>
      <path class="smile" d="M84 121 Q100 133 116 121" fill="none" stroke-width="4.5" stroke-linecap="round"/>
      <ellipse class="talk" cx="100" cy="124" rx="9" ry="4"/>
    </svg>
  </div>

  <div class="status" id="status">Tap Glasscode to start talking</div>
  <div class="caption" id="caption" aria-live="polite"></div>

  <div class="counts" id="counts"><span class="skeleton">reading your sessions…</span></div>
  <ul class="sessions" id="sessions"></ul>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
