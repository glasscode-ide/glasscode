[package]
name = "gpui_macros"
version = "0.1.0"
publish = false
license = "Apache-2.0"
description = "Macros used by gpui"

[package.edition]
workspace = true

[lints]
workspace = true

[features]
inspector = []

[lib]
path = "src/gpui_macros.rs"
proc-macro = true
doctest = true
test = false

[dependencies]
heck = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true, default-features = true, features = ["full", "extra-traits", "visit-mut"] }
